<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@postReaction.add.headline">Add Post Reaction</h1>
    <div>
        <a routerLink="/postReactions" class="btn btn-secondary" i18n="@@postReaction.add.back">Back to list</a>
    </div>
</div>
<form [formGroup]="addForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="addForm" field="reaction" i18n-label="@@postReaction.reaction.label" label="Reaction" />
    <app-input-row [group]="addForm" field="createdAt" i18n-label="@@postReaction.createdAt.label" label="Created At" />
    <app-input-row [group]="addForm" field="user" rowType="select" [options]="userValues" i18n-label="@@postReaction.user.label" label="User" />
    <app-input-row [group]="addForm" field="post" rowType="select" [options]="postValues" i18n-label="@@postReaction.post.label" label="Post" />
    <input type="submit" i18n-value="@@postReaction.add.headline" value="Add Post Reaction" class="btn btn-primary mt-4" />
</form>
