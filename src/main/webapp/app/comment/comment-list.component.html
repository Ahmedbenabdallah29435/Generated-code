<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@comment.list.headline">Comments</h1>
    <div>
        <a routerLink="/comments/add" class="btn btn-primary ms-2" i18n="@@comment.list.createNew">Create new Comment</a>
    </div>
</div>
@if (!comments || comments.length === 0) {
<div i18n="@@comment.list.empty">No Comments could be found.</div>
} @else {
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th scope="col" i18n="@@comment.id.label">Id</th>
                <th scope="col" i18n="@@comment.createdAt.label">Created At</th>
                <th scope="col" i18n="@@comment.user.label">User</th>
                <th scope="col" i18n="@@comment.post.label">Post</th>
                <th><!-- --></th>
            </tr>
        </thead>
        <tbody>
            @for (comment of comments; track comment.id) {
            <tr>
                <td>{{ comment.id }}</td>
                <td>{{ comment.createdAt }}</td>
                <td>{{ comment.user }}</td>
                <td>{{ comment.post }}</td>
                <td>
                    <div class="float-end text-nowrap">
                        <a [routerLink]="['/comments/edit', comment.id]" class="btn btn-sm btn-secondary" i18n="@@comment.list.edit">Edit</a>
                        <button type="button" (click)="confirmDelete(comment.id!)" class="btn btn-sm btn-secondary" i18n="@@comment.list.delete">Delete</button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
}
