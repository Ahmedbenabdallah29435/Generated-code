<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@commentReaction.add.headline">Add Comment Reaction</h1>
    <div>
        <a routerLink="/commentReactions" class="btn btn-secondary" i18n="@@commentReaction.add.back">Back to list</a>
    </div>
</div>
<form [formGroup]="addForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="addForm" field="reaction" i18n-label="@@commentReaction.reaction.label" label="Reaction" />
    <app-input-row [group]="addForm" field="createdAt" i18n-label="@@commentReaction.createdAt.label" label="Created At" />
    <app-input-row [group]="addForm" field="user" rowType="select" [options]="userValues" i18n-label="@@commentReaction.user.label" label="User" />
    <app-input-row [group]="addForm" field="comment" rowType="select" [options]="commentValues" i18n-label="@@commentReaction.comment.label" label="Comment" />
    <input type="submit" i18n-value="@@commentReaction.add.headline" value="Add Comment Reaction" class="btn btn-primary mt-4" />
</form>
