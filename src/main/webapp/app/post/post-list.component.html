<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@post.list.headline">Posts</h1>
    <div>
        <a routerLink="/posts/add" class="btn btn-primary ms-2" i18n="@@post.list.createNew">Create new Post</a>
    </div>
</div>
@if (!posts || posts.length === 0) {
<div i18n="@@post.list.empty">No Posts could be found.</div>
} @else {
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead>
            <tr>
                <th scope="col" i18n="@@post.id.label">Id</th>
                <th scope="col" i18n="@@post.title.label">Title</th>
                <th scope="col" i18n="@@post.createdAt.label">Created At</th>
                <th scope="col" i18n="@@post.updatedAt.label">Updated At</th>
                <th scope="col" i18n="@@post.user.label">User</th>
                <th><!-- --></th>
            </tr>
        </thead>
        <tbody>
            @for (post of posts; track post.id) {
            <tr>
                <td>{{ post.id }}</td>
                <td>{{ post.title }}</td>
                <td>{{ post.createdAt }}</td>
                <td>{{ post.updatedAt }}</td>
                <td>{{ post.user }}</td>
                <td>
                    <div class="float-end text-nowrap">
                        <a [routerLink]="['/posts/edit', post.id]" class="btn btn-sm btn-secondary" i18n="@@post.list.edit">Edit</a>
                        <button type="button" (click)="confirmDelete(post.id!)" class="btn btn-sm btn-secondary" i18n="@@post.list.delete">Delete</button>
                    </div>
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
}
